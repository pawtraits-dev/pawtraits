<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:{{#if margin}}{{margin}}{{else}}24px 0 8px{{/if}};">
  <tr><td align="center" style="border-radius:12px;background:{{#if dark}}#2A1A52{{else}}#9333ea{{/if}};">
    <a href="{{url}}" style="display:block;padding:16px 20px;font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:bold;line-height:1.2;color:#ffffff;text-decoration:none;border-radius:12px;">{{label}}</a>
  </td></tr>
</table>
