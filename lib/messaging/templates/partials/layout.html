<!DOCTYPE html>
<html lang="en-GB" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{title}}</title>
<link href="https://fonts.googleapis.com/css2?family=Life+Savers:wght@800&display=swap" rel="stylesheet">
<style>
  @media (max-width: 620px) {
    .pt-card { border-radius: 0 !important; }
    .pt-pad { padding-left: 20px !important; padding-right: 20px !important; }
    .pt-h1 { font-size: 28px !important; }
  }
  a { color: #7e22ce; }
</style>
</head>
<body style="margin:0;padding:0;background:#F6F2FC;-webkit-text-size-adjust:100%;">
  <!-- Preheader: the line inbox apps show after the subject -->
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#F6F2FC;">{{preheader}}&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F6F2FC;">
    <tr><td align="center" style="padding:24px 0;">
      <table role="presentation" class="pt-card" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#ffffff;border-radius:16px;overflow:hidden;">
        <tr><td class="pt-pad" style="padding:22px 32px 6px;">
          <a href="{{#if base_url}}{{base_url}}{{else}}https://pawtraits.pics{{/if}}" style="text-decoration:none;">
            <img src="{{#if base_url}}{{base_url}}{{else}}https://pawtraits.pics{{/if}}/assets/email/paw-96.png" width="32" height="32" alt="" style="vertical-align:middle;border:0;">
            <span style="vertical-align:middle;margin-left:6px;font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:bold;color:#7e22ce;">Pawtraits</span>
          </a>
        </td></tr>
        {{> @partial-block }}
        <tr><td class="pt-pad" style="padding:24px 32px 28px;border-top:1px solid #EEE8F7;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.6;color:#6b7280;">
          Questions? Just reply to this email, or write to <a href="mailto:support@pawtraits.pics" style="color:#7e22ce;">support@pawtraits.pics</a>.<br>
          <a href="{{#if base_url}}{{base_url}}{{else}}https://pawtraits.pics{{/if}}" style="color:#6b7280;">pawtraits.pics</a> &middot;
          <a href="https://www.instagram.com/pawtraits" style="color:#6b7280;">Instagram</a> &middot;
          <a href="{{#if base_url}}{{base_url}}{{else}}https://pawtraits.pics{{/if}}/help" style="color:#6b7280;">Help &amp; delivery</a>
          {{#if footer_note}}<br><span style="color:#9ca3af;">{{footer_note}}</span>{{/if}}
          {{#if unsubscribe_url}}<br><a href="{{unsubscribe_url}}" style="color:#9ca3af;">Unsubscribe from these emails</a>{{/if}}
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
